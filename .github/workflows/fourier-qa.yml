name: Build and compare TapTalk speech engines
on:
  push:
    branches: [qa/fourier-dictation]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          test "$(uname -m)" = arm64
          sysctl -n machdep.cpu.brand_string
          command -v xcodegen || brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            ~/Library/Caches/org.swift.swiftpm
          key: tap-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock', 'project.yml') }}
      - name: Build the unmodified distribution target
        run: |
          set -eo pipefail
          make xcode
          xcodebuild -project TapTalk.xcodeproj -scheme TapTalk -configuration Release -derivedDataPath /tmp/taptalk-build CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=NO build >/tmp/taptalk-xcode.log 2>&1 || { grep -E '(warning|error):' /tmp/taptalk-xcode.log | tail -40; tail -22 /tmp/taptalk-xcode.log; exit 1; }
      - name: Save the tested developer build
        run: |
          ditto -c -k --sequesterRsrc --keepParent /tmp/taptalk-build/Build/Products/Release/TapTalk.app /tmp/TapTalk-Fourier-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TapTalk-Fourier-developer-build
          path: /tmp/TapTalk-Fourier-dev.zip
      - name: Compile instrumented editor target
        run: bash .github/fourier-qa/benchmark.sh
      - name: Start AppKit and check the first stage
        run: |
          nohup bash -c 'bash .github/fourier-qa/run-and-observe.sh; echo $? > /tmp/taptalk-status' >/tmp/taptalk-observer.log 2>&1 </dev/null &
          for attempt in {1..30}; do
            if grep -q 'STAGE' /tmp/taptalk-bench-run.log 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/taptalk-bench-run.log || true
          if ! grep -q 'STAGE' /tmp/taptalk-bench-run.log; then sample "$(cat /tmp/taptalk-bench-pid)" 2 10 -file /tmp/taptalk-sample.txt || true; exit 1; fi
      - name: Verify both model installations
        run: |
          for attempt in {1..360}; do
            if grep -q 'both models ready' /tmp/taptalk-bench-run.log; then exit 0; fi
            if [ -f /tmp/taptalk-status ]; then break; fi
            sleep 2
          done
          tail -30 /tmp/taptalk-bench-run.log
          sample "$(cat /tmp/taptalk-bench-pid)" 2 10 -file /tmp/taptalk-sample.txt || true
          exit 1
      - name: Measure release to visible text for both engines
        run: |
          for attempt in {1..720}; do
            if [ -f /tmp/taptalk-status ]; then cat /tmp/taptalk-bench-run.log; exit "$(cat /tmp/taptalk-status)"; fi
            sleep 2
          done
          tail -40 /tmp/taptalk-bench-run.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taptalk-comparison
          path: |
            /tmp/taptalk-result.json
            /tmp/taptalk-xcode.log
            /tmp/taptalk-bench-build.log
            /tmp/taptalk-bench-run.log
            /tmp/taptalk-sample.txt
